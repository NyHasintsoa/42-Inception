#------------------------------------------------------
# Services
#------------------------------------------------------
services:
  #--------------------
  # MariaDB Service
  #--------------------
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    networks:
      - inception
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb-data:/var/lib/mysql

  #--------------------
  # Redis Service
  #--------------------
  redis:
    build:
      context: requirements/bonus/redis
      dockerfile: Dockerfile
    image: redis
    container_name: redis
    restart: always
    networks:
      - inception
    ports:
      - "6379:6379"
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  #--------------------
  # WordPress Service
  #--------------------
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    networks:
      - inception
    environment:
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_NAME: ${DB_NAME}
      DOMAIN_NAME: "${DOMAIN_NAME}"
      WP_TITLE: ${WP_TITLE}
      WP_ADMIN_USER: ${WP_ADMIN_USER}
      WP_ADMIN_PASSWORD: ${WP_ADMIN_PASSWORD}
      WP_ADMIN_EMAIL: ${WP_ADMIN_EMAIL}
      WP_USER: ${WP_USER}
      WP_USER_PASSWORD: ${WP_USER_PASSWORD}
      WP_USER_EMAIL: ${WP_USER_EMAIL}
    secrets:
      - db_password
    volumes:
      - wordpress-data:/var/www/wordpress
    depends_on:
      - mariadb
      - redis
  #--------------------
  # Web Server Service
  #--------------------
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    networks:
      - inception
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME}"
    ports:
      - "443:443"
    volumes:
      - wordpress-data:/var/www/wordpress
    depends_on:
      - wordpress

  #--------------------
  # Adminer Service
  #--------------------
  adminer:
    build:
      context: requirements/bonus/adminer
      dockerfile: Dockerfile
    container_name: adminer
    restart: always
    ports:
      - "8080:8080"
    networks:
      - inception
    depends_on:
      - mariadb

  #--------------------
  # FTP Service
  #--------------------
  ftp:
    build:
      context: requirements/bonus/ftp
      dockerfile: Dockerfile
    container_name: ftp
    restart: always
    ports:
      - "21:21"
      - "21100-21110:21100-21110"
    environment:
      FTP_USER: "${FTP_USER}"
      FTP_PASSWORD: "${FTP_PASSWORD}"
    secrets:
      - db_password
    volumes:
      - wordpress-data:/var/www/wordpress
    networks:
      - inception
    depends_on:
      - wordpress

  #--------------------
  # Static Website Service
  #--------------------
  static-website:
    build:
      context: requirements/bonus/static-website
      dockerfile: Dockerfile
    image: static-website
    container_name: static-website
    restart: always
    ports:
      - "8000:8000"
    networks:
      - inception

  #--------------------
  # Portnair Service
  #--------------------
  portainer:
    build:
      context: requirements/bonus/portainer
      dockerfile: Dockerfile
    container_name: portainer
    ports:
      - "9090:9090"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - portainer-data:/data
    networks:
      - inception

#------------------------------------------------------
# Networks
#------------------------------------------------------
networks:
  inception:
    name: inception

#------------------------------------------------------
# Volumes
#------------------------------------------------------
volumes:
  mariadb-data:
    name: mariadb-data
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb
      o: bind
  wordpress-data:
    name: wordpress-data
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/wordpress
      o: bind
  portainer-data:
    name: portainer-data

#------------------------------------------------------
# Secrets
#------------------------------------------------------
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
