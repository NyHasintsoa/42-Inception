#------------------------------------------------------
# Services
#------------------------------------------------------
services:
  #--------------------
  # Database Service
  #--------------------
  mariadb:
    build:
      context: requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    restart: always
    networks:
      - inception
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
    secrets:
      - db_password
      - db_root_password
    volumes:
      - mariadb-data:/var/lib/mysql

  #--------------------
  # WordPress Service
  #--------------------
  wordpress:
    build:
      context: requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    restart: always
    networks:
      - inception
    environment:
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_NAME: ${DB_NAME}
      DOMAIN_NAME: "${DOMAIN_NAME}"
    secrets:
      - db_password
    volumes:
      - wordpress-data:/var/www/wordpress
    depends_on:
      - mariadb

  #--------------------
  # Web Server Service
  #--------------------
  nginx:
    build:
      context: requirements/nginx
      dockerfile: Dockerfile
    container_name: nginx
    restart: always
    networks:
      - inception
    environment:
      DOMAIN_NAME: "${DOMAIN_NAME}"
    ports:
      - "443:443"
    volumes:
      - wordpress-data:/var/www/wordpress
    depends_on:
      - wordpress

#------------------------------------------------------
# Networks
#------------------------------------------------------
networks:
  inception:
    name: inception

#------------------------------------------------------
# Volumes
#------------------------------------------------------
volumes:
  mariadb-data:
    name: mariadb-data
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/mariadb
      o: bind
  wordpress-data:
    name: wordpress-data
    driver: local
    driver_opts:
      type: none
      device: ${HOME}/data/wordpress
      o: bind

#------------------------------------------------------
# Secrets
#------------------------------------------------------
secrets:
  db_password:
    file: ../secrets/db_password.txt
  db_root_password:
    file: ../secrets/db_root_password.txt
